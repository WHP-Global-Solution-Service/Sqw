<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    
    <!-- DNS Prefetch & Preconnect for faster loading -->
    <link rel="dns-prefetch" href="//api.longdo.com">
    <link rel="dns-prefetch" href="//firebaseio.com">
    <link rel="preconnect" href="https://api.longdo.com" crossorigin>
    
    <!-- External scripts with defer for non-blocking load -->
    <script defer src="https://api.longdo.com/services"></script>
    <!-- Turf.js removed - using npm package instead -->

    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
